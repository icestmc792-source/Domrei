# ==============================================================================
# File: config/termux-x11.conf
# Purpose: Recommended Termux-X11 preferences for Minecraft: Java Edition
# ==============================================================================

# Display Mode & Refresh
# Set display scale to match native device PPI or scale down for better FPS
# 100 = 100% (Native), 80 = 80%, etc.
display_scale=100

# Fullscreen mode (true/false)
fullscreen=true

# Touch / Pointer Control Mode:
# 'touch'        - Direct touch interaction
# 'trackpad'     - Virtual trackpad cursor (recommended for desktop menus)
# 'mouse_passthrough' - Ideal when using physical Bluetooth/USB mouse
touch_mode=trackpad

# Hardware Keyboard & Mouse
enable_mouse_capture=true
intercept_system_shortcuts=true

# Audio output sink
audio_engine=pulseaudio
