# ==============================================================================
# File: config/jvm_options.conf
# Purpose: Optimized JVM arguments for Minecraft: Java Edition running on
#          Eclipse Temurin® OpenJDK (aarch64 / ARM64) on Android devices.
# ==============================================================================

# Memory Allocation (Adjust based on your device RAM)
# 4GB-6GB RAM devices:  -Xms1536M -Xmx2560M
# 8GB-12GB RAM devices: -Xms2048M -Xmx4096M
# 16GB+ RAM devices:    -Xms4096M -Xmx8192M
-Xms2048M
-Xmx4096M

# Garbage Collector: G1GC tuned for mobile ARM64 CPU latency
-XX:+UseG1GC
-XX:+ParallelRefProcEnabled
-XX:MaxGCPauseMillis=200
-XX:+UnlockExperimentalVMOptions
-XX:+DisableExplicitGC
-XX:+AlwaysPreTouch
-XX:G1NewSizePercent=30
-XX:G1MaxNewSizePercent=40
-XX:G1ReservePercent=20
-XX:G1HeapWastePercent=5
-XX:G1MixedGCCountTarget=4
-XX:InitiatingHeapOccupancyPercent=15
-XX:G1MixedGCLiveThresholdPercent=90
-XX:G1RSetUpdatingPauseTimePercent=5
-XX:SurvivorRatio=32
-XX:+PerfDisableSharedMem
-XX:MaxTenuringThreshold=1

# Native Library and Graphics Options
-Dorg.lwjgl.opengl.Display.allowSoftwareOpenGL=true
-Dsun.java2d.opengl=false
-Dsun.rmi.dgc.server.gcInterval=2147483646
